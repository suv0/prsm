<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>PRism: paste a PR link, three review passes run side by side, then triage one finding at a time</title>
  <!-- One 16-second loop:
       0-3s paste the PR link, 3-9s three passes run in parallel, 9-16s one finding in triage. -->
  <defs>
    <clipPath id="typing">
      <rect x="64" y="150" height="34" width="0">
        <animate attributeName="width" dur="16s" repeatCount="indefinite"
                 values="0;0;440;440" keyTimes="0;0.03;0.15;1" calcMode="linear"/>
      </rect>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121414"/>
      <stop offset="1" stop-color="#1A1D1F"/>
    </linearGradient>
  </defs>

  <!-- the hub window -->
  <rect x="0" y="0" width="760" height="360" rx="18" fill="url(#bg)"/>
  <rect x="24" y="20" width="712" height="282" rx="12" fill="#1E1E1E" stroke="#3E4850"/>
  <rect x="40" y="32" width="24" height="24" rx="6" fill="#4FC1FF"/>
  <text x="52" y="49" fill="#121414" font-size="13" font-weight="bold" text-anchor="middle">P</text>
  <text x="76" y="49" fill="#E2E2E2" font-size="15" font-weight="600">PRism</text>

  <!-- top tabs: the active one follows the phase -->
  <g font-size="13" fill="#BEC8D1">
    <text x="450" y="49">New review</text>
    <text x="550" y="49">Live run</text>
    <text x="634" y="49">Triage</text>
  </g>
  <rect x="450" y="56" width="74" height="2" fill="#4FC1FF">
    <animate attributeName="x" dur="16s" repeatCount="indefinite" calcMode="discrete"
             values="450;550;634" keyTimes="0;0.19;0.56"/>
    <animate attributeName="width" dur="16s" repeatCount="indefinite" calcMode="discrete"
             values="74;56;42" keyTimes="0;0.19;0.56"/>
  </rect>
  <line x1="24" y1="68" x2="736" y2="68" stroke="#3E4850"/>

  <!-- 1. paste a PR link -->
  <g opacity="0">
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete"
             values="1;0" keyTimes="0;0.19"/>
    <text x="48" y="110" fill="#E2E2E2" font-size="20" font-weight="600">New review</text>
    <text x="48" y="134" fill="#BEC8D1" font-size="14">Paste any GitHub pull request</text>
    <rect x="48" y="148" width="664" height="40" rx="8" fill="#121414" stroke="#4FC1FF"/>
    <text x="64" y="174" fill="#9CDCFE" font-size="15" font-family="Consolas, Menlo, monospace" clip-path="url(#typing)">https://github.com/acme/shop/pull/42</text>
    <rect x="48" y="206" width="132" height="38" rx="8" fill="#4FC1FF"/>
    <text x="114" y="230" fill="#121414" font-size="14" font-weight="600" text-anchor="middle">Run review</text>
    <text x="196" y="230" fill="#BEC8D1" font-size="13">Cursor · Claude Code · Codex · your own CLI</text>
  </g>

  <!-- 2. three passes, in parallel -->
  <g opacity="0">
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete"
             values="0;1;0" keyTimes="0;0.19;0.56"/>
    <text x="48" y="104" fill="#E2E2E2" font-size="18" font-weight="600">Live run · PR #42</text>
    <text x="712" y="104" fill="#BEC8D1" font-size="13" text-anchor="end">3 passes in parallel</text>

    <g font-size="15" fill="#E2E2E2">
      <text x="48" y="146">Correctness</text>
      <text x="48" y="196">Nitpick</text>
      <text x="48" y="246">Devil’s advocate</text>
    </g>
    <rect x="200" y="134" width="512" height="14" rx="7" fill="#2D2D2D"/>
    <rect x="200" y="184" width="512" height="14" rx="7" fill="#2D2D2D"/>
    <rect x="200" y="234" width="512" height="14" rx="7" fill="#2D2D2D"/>
    <rect x="200" y="134" width="0" height="14" rx="7" fill="#4FC1FF">
      <animate attributeName="width" dur="16s" repeatCount="indefinite"
               values="0;0;512;512" keyTimes="0;0.2;0.48;1"/>
    </rect>
    <rect x="200" y="184" width="0" height="14" rx="7" fill="#4FC1FF">
      <animate attributeName="width" dur="16s" repeatCount="indefinite"
               values="0;0;512;512" keyTimes="0;0.2;0.38;1"/>
    </rect>
    <rect x="200" y="234" width="0" height="14" rx="7" fill="#4FC1FF">
      <animate attributeName="width" dur="16s" repeatCount="indefinite"
               values="0;0;512;512" keyTimes="0;0.2;0.53;1"/>
    </rect>
    <text x="48" y="282" fill="#BEC8D1" font-size="13">Findings merge as each pass finishes. Same issue twice becomes one card.</text>
  </g>

  <!-- 3. triage, one finding at a time -->
  <g opacity="0">
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete"
             values="0;1" keyTimes="0;0.56"/>
    <rect x="48" y="84" width="62" height="22" rx="4" fill="#3B2A10"/>
    <text x="79" y="100" fill="#F5A524" font-size="12" font-weight="bold" text-anchor="middle">MAJOR</text>
    <text x="122" y="100" fill="#9CDCFE" font-size="13" font-family="Consolas, Menlo, monospace">src/cart/total.ts · L18–24</text>
    <text x="712" y="100" fill="#BEC8D1" font-size="13" text-anchor="end">1 of 6</text>
    <text x="48" y="136" fill="#E2E2E2" font-size="17">The discount is applied twice when a coupon stacks.</text>

    <rect x="48" y="152" width="664" height="76" rx="8" fill="#282A2B" stroke="#3E4850"/>
    <text x="64" y="174" fill="#BEC8D1" font-size="12" letter-spacing="1">SUGGESTED COMMENT</text>
    <text x="64" y="198" fill="#E2E2E2" font-size="14">Could we apply the coupon once, after the subtotal? With two</text>
    <text x="64" y="218" fill="#E2E2E2" font-size="14">coupons the cart total goes below the real price.</text>

    <g font-size="13">
      <rect x="48" y="246" width="100" height="34" rx="6" fill="#121414" stroke="#3E4850"/>
      <text x="98" y="268" fill="#E2E2E2" text-anchor="middle">False alarm</text>
      <rect x="158" y="246" width="70" height="34" rx="6" fill="#121414" stroke="#3E4850"/>
      <text x="193" y="268" fill="#E2E2E2" text-anchor="middle">Copy</text>
      <rect x="238" y="246" width="88" height="34" rx="6" fill="#121414" stroke="#3E4850"/>
      <text x="282" y="268" fill="#E2E2E2" text-anchor="middle">Resolved</text>
      <rect x="590" y="246" width="122" height="34" rx="6" fill="#4FC1FF"/>
      <text x="651" y="268" fill="#121414" font-weight="600" text-anchor="middle">Next finding →</text>
    </g>
    <!-- "Copied" flashes after Copy -->
    <g opacity="0">
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete"
               values="0;1;0" keyTimes="0;0.75;0.9"/>
      <rect x="158" y="246" width="70" height="34" rx="6" fill="#4FC1FF"/>
      <text x="193" y="268" fill="#121414" font-size="13" font-weight="600" text-anchor="middle">Copied</text>
    </g>
  </g>

  <!-- the promise -->
  <circle cx="36" cy="330" r="5" fill="#22A06B"/>
  <text x="50" y="335" fill="#BEC8D1" font-size="14">Runs on your machine. Never posts to GitHub; you paste the comments yourself.</text>
</svg>
